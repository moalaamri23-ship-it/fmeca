<!DOCTYPE html>
<html>
<head><title>Select Folder</title></head>
<body style="font-family:sans-serif;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;height:100vh;margin:0;background:#f8fafc;color:#334155">
<button id="btn" style="padding:12px 28px;font-size:16px;font-weight:600;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer">
  Select Project Folder
</button>
<div id="err" style="font-size:12px;color:#b91c1c;text-align:center;max-width:340px"></div>
<script>
var replied = false;
var projectId = new URLSearchParams(window.location.search).get('project');

function reply(msg) {
  if (replied) return;
  replied = true;
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(msg, window.location.origin);
    window.close();
  } else {
    document.getElementById('err').textContent =
      'Lost the connection to FMECA Studio. Close this window and try again.';
  }
}

// Same DB/store/version as services/FileSystem.ts — the app re-reads the handle
// from IndexedDB instead of receiving it through postMessage. Passing a live
// directory handle between windows and then writing through it after this popup
// closes can crash the browser outright; a rehydrated handle cannot.
function saveHandle(handle) {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open('FmecaPro_FS', 2);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('project_handles')) db.createObjectStore('project_handles');
      if (!db.objectStoreNames.contains('blob_files')) db.createObjectStore('blob_files');
    };
    req.onerror = function () { reject(new Error('Could not open storage.')); };
    req.onsuccess = function (e) {
      var db = e.target.result;
      var tx = db.transaction('project_handles', 'readwrite');
      tx.objectStore('project_handles').put(handle, projectId);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(new Error('Could not save the folder handle.')); };
    };
  });
}

document.getElementById('btn').addEventListener('click', async function () {
  document.getElementById('err').textContent = '';
  var handle;
  try {
    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    if (e && e.name === 'AbortError') { reply({ type: 'fmeca-folder-cancelled' }); return; }
    document.getElementById('err').textContent = (e && e.message) || 'Could not open the folder picker.';
    return;
  }
  // Confirm write access here, in a top-level window where the permission prompt works.
  try {
    var state = await handle.queryPermission({ mode: 'readwrite' });
    if (state !== 'granted') state = await handle.requestPermission({ mode: 'readwrite' });
    if (state !== 'granted') {
      document.getElementById('err').textContent =
        'Write access to that folder was refused. Create a subfolder (e.g. Documents/FMECA) and pick that instead.';
      return;
    }
  } catch (e) { /* older browsers without queryPermission — let the app find out */ }

  if (projectId) {
    try {
      await saveHandle(handle);
      reply({ type: 'fmeca-folder-saved' });
      return;
    } catch (e) {
      document.getElementById('err').textContent = (e && e.message) || 'Could not save the folder.';
      return;
    }
  }
  // No project id in the URL (legacy opener) — fall back to posting the handle.
  reply({ type: 'fmeca-folder-picked', handle: handle });
});

// Closing the window without picking counts as a cancellation.
window.addEventListener('pagehide', function () { reply({ type: 'fmeca-folder-cancelled' }); });
</script>
</body>
</html>
